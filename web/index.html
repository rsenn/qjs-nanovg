<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qjs-nanovg in the browser</title>
<style>
  :root { color-scheme: dark; --bg: #14171d; --panel: #1d222b; --line: #2b323e; --fg: #dde3ec; --dim: #8b96a8; --accent: #5aa9ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1024px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--dim); margin: 0 0 20px; }
  nav { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
  iframe { display: block; width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: 6px; background: #000; }
  section { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; }
  section p { margin: 0 0 8px; }
  ul { margin: 0; padding-left: 20px; color: var(--dim); }
  a { color: var(--accent); }
  footer { margin-top: 24px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>qjs-nanovg in the browser</h1>
  <p class="lead">The unmodified QuickJS demo scripts, running against NanoVG compiled to WebAssembly on WebGL2.</p>

  <nav role="tablist" id="tabs"></nav>
  <iframe id="frame" title="demo" allow="fullscreen"></iframe>

  <section>
    <p id="desc"></p>
    <ul id="controls"></ul>
    <p style="margin-top:8px"><a id="source" href="#">View source</a></p>
  </section>

  <footer>Click the canvas to give it keyboard focus. Mouse only, no touch. Esc/Q stops a demo; reload to restart it.</footer>
</main>
<script>
const demos = {
  'planets': {
    title: 'Planets',
    desc: 'Four planets on tilted elliptical orbits, animated with save/restore, transforms and gradient-free vector fills.',
    controls: ['Space: pause / resume', '+ / −: change speed', '← / →: step one frame', '↑ / ↓: reset'],
  },
  'curve-editor': {
    title: 'Curve editor',
    desc: 'Editable polylines that can be retyped as straight lines, quadratic or cubic Béziers.',
    controls: ['Drag a handle: move it', 'Click empty canvas: append a point', 'Right-click an anchor: delete it', 'Line / Quad / Cubic: retype the active path', 's or Save: download polylines.json'],
  },
  'polyline-editor': {
    title: 'Polyline editor',
    desc: 'Editable polylines with draggable vertices.',
    controls: ['Drag a handle: move it', 'Click empty canvas: append a point', 'Right-click a handle: delete it', 's or Save: download polylines.json'],
  },
};

const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');

for(const [id, d] of Object.entries(demos)) {
  const b = document.createElement('button');
  b.role = 'tab';
  b.textContent = d.title;
  b.dataset.id = id;
  b.onclick = () => select(id);
  tabs.append(b);
}

function select(id) {
  const d = demos[id] ?? demos.planets;
  if(!demos[id]) id = 'planets';
  for(const b of tabs.children) b.setAttribute('aria-selected', b.dataset.id === id);
  frame.src = `run.html?example=${id}`;
  document.getElementById('desc').textContent = d.desc;
  document.getElementById('controls').replaceChildren(...d.controls.map(c => Object.assign(document.createElement('li'), { textContent: c })));
  document.getElementById('source').href = `examples/${id}.js`;
  history.replaceState(null, '', `#${id}`);
}

frame.addEventListener('load', () => frame.contentWindow.focus());
select(location.hash.slice(1));
</script>
</body>
</html>
